services:
  cricketapp:
    build: .
    image: cricketapp
    container_name: cricketapp
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@cricketdb:5432/moviedb
    depends_on:
      cricketdb:
        condition: service_healthy
    restart: unless-stopped

  cricketdb:
    image: postgres:16-alpine
    container_name: cricketdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moviedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
