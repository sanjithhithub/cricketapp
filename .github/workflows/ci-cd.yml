name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Only build-and-push needs to write packages, so it
# widens its own token below rather than every job inheriting write access.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sanjithhithub/cricketapp

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The instance is small on disk, so prune build cache from previous
          # runs. Without this the runner is fine, but it keeps pushing harder
          # to complete builds for no benefit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          # `fingerprint` pins the server's host key by SHA256. Leaving it unset
          # makes the action skip host key verification entirely (its documented
          # default), so this secret is what stops a man-in-the-middle on port 22
          # from capturing SSH_KEY and GHCR_PAT. Set it once, from the value
          # printed below, and never rotate it without also updating the EC2
          # host keys.
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml,deploy.sh"
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # Fail the job on the first non-zero exit inside the script.
          # Without this the action keeps going after a failed step, which turns
          # a broken deploy into a green checkmark.
          command_timeout: 10m
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            chmod +x deploy.sh
            ./deploy.sh
            # The container answers on loopback but that alone does not prove the
            # public path works, and the certificate is only issued once Caddy is
            # reloaded. Verify end to end so a bad deploy cannot report success.
            curl -sf https://cricketapp.in/health
          envs: GHCR_USERNAME,GHCR_PAT
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}