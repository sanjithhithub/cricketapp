name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Only build-and-push needs to write packages, so it
# widens its own token below rather than every job inheriting write access.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sanjithhithub/cricketapp

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Install workflow checker dependencies
        # check_workflows.py needs PyYAML. requirements.txt is not installed in
        # this job because lint runs before the app dependencies are needed.
        run: pip install pyyaml

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate workflow YAML
        # GitHub rejects a malformed workflow at dispatch time, so the run fails
        # before any job starts and the error only shows in the Actions UI. A
        # mis-indented block scalar is invisible to pytest and ruff, which is how
        # a broken deploy got pushed once already.
        run: python check_workflows.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The instance is small on disk, so prune build cache from previous
          # runs. Without this the runner is fine, but it keeps pushing harder
          # to complete builds for no benefit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain ssh/scp rather than appleboy/scp-action and ssh-action. Those two
      # download a Go binary from a release URL on every run and parse the key
      # from a secret through their own loader; when either step broke, the
      # failure surfaced only inside a log this workflow cannot read unauthenticated.
      # Plain openssh does the same job with shell output in the job log, so the
      # next failure is diagnosable without extra tooling.

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail

          # Create the directory before writing into it. The runner image does
          # not guarantee ~/.ssh exists, and the previous ordering wrote the key
          # first, so install failed on a missing directory and set -e aborted
          # the step with a message that looked like a bad key.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write to a fixed path with an explicit umask. A key created 0644 is
          # rejected by ssh, and printf into an existing file would leave any
          # prior key's trailing bytes in place.
          umask 077
          : > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Name the failure precisely. A key whose PEM armour was lost in
          # transit otherwise surfaces much later as an opaque format error.
          if ! grep -q -- '-----BEGIN' ~/.ssh/id_deploy; then
            echo "::error::SSH_KEY has no '-----BEGIN ... PRIVATE KEY-----' header. Paste the whole key, first line to last."
            exit 1
          fi
          if ! grep -q -- '-----END' ~/.ssh/id_deploy; then
            echo "::error::SSH_KEY has no '-----END ... PRIVATE KEY-----' footer."
            exit 1
          fi
          if ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "SSH key is valid"
          else
            echo "::error::SSH_KEY could not be parsed. Check for CRLF line endings or a truncated paste."
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          # The host is pinned rather than trusted blindly. Accepting whatever
          # answers on port 22 would let a man-in-the-middle capture SSH_KEY and
          # GHCR_PAT during every deploy.
          #
          # ed25519 only. A host offers RSA, ECDSA and ED25519 keys, and the
          # secret holds just one, so comparing against all three could never
          # match. Restricting the scan makes it a single value to compare, and
          # dropping the comment line keeps it out of ssh-keygen's input.
          scan=$(mktemp)
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null | grep -v '^#' > "$scan" || true
          if [ ! -s "$scan" ]; then
            echo "::error::no host key returned by $DEPLOY_HOST - is port ${SSH_PORT:-22} open?"
            exit 1
          fi

          actual=$(ssh-keygen -E sha256 -lf "$scan" | awk '{print $2}')
          echo "  scanned: $actual"

          if [ "$actual" != "$SSH_FINGERPRINT" ]; then
            echo "::error::host key mismatch"
            echo "::error::  expected: $SSH_FINGERPRINT"
            echo "::error::  scanned:  $actual"
            echo "::error::If the host keys were rotated, update SSH_FINGERPRINT to the scanned value."
            exit 1
          fi
          echo "host key verified: $actual"

          # known_hosts holds only the key that matched, so no other host key can
          # be used to authenticate later.
          rm -f ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/known_hosts
          cat "$scan" >> ~/.ssh/known_hosts
          rm -f "$scan"
          ssh-keygen -E sha256 -lf ~/.ssh/known_hosts

      - name: Copy deploy files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker-compose.prod.yml deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Run deploy script on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_DIR"
          chmod +x deploy.sh
          ./deploy.sh
          REMOTE

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          # A container answering on loopback does not prove the public path
          # works, and the certificate only exists once Caddy has reloaded. Check
          # the real URL so a broken release cannot report success.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 https://cricketapp.in/health)
          echo "https://cricketapp.in/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::public health check returned $code, expected 200"
            exit 1
          fi