name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Only build-and-push needs to write packages, so it
# widens its own token below rather than every job inheriting write access.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sanjithhithub/cricketapp

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The instance is small on disk, so prune build cache from previous
          # runs. Without this the runner is fine, but it keeps pushing harder
          # to complete builds for no benefit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain ssh/scp rather than appleboy/scp-action and ssh-action. Those two
      # download a Go binary from a release URL on every run and parse the key
      # from a secret through their own loader; when either step broke, the
      # failure surfaced only inside a log this workflow cannot read unauthenticated.
      # Plain openssh does the same job with shell output in the job log, so the
      # next failure is diagnosable without extra tooling.

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Guard against a secret that lost its PEM armour in transit. Without
          # the BEGIN line, ssh fails later with an opaque "bad permissions" or
          # "invalid format" message.
          if ! head -1 ~/.ssh/id_deploy | grep -q 'BEGIN'; then
            echo "::error::SSH_KEY is missing its '-----BEGIN ... PRIVATE KEY-----' header"
            exit 1
          fi

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          # The key is pinned rather than trusted blindly. Accepting whatever
          # answers on port 22 would let a man-in-the-middle capture SSH_KEY and
          # GHCR_PAT during every deploy.
          ssh-keyscan -t rsa,ecdsa,ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Confirm the scanned keys really are the ones expected, then drop
          # anything unrecognised so a substituted host cannot slip through.
          ssh-keygen -lf ~/.ssh/known_hosts | while read -r bits fingerprint name type; do
            if [ "$fingerprint" != "$SSH_FINGERPRINT" ]; then
              echo "::error::host key mismatch for $name: expected $SSH_FINGERPRINT, got $fingerprint"
              exit 1
            fi
          done
          echo "host key verified: $SSH_FINGERPRINT"

      - name: Copy deploy files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker-compose.prod.yml deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Run deploy script on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_DIR"
          chmod +x deploy.sh
          ./deploy.sh
          REMOTE

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          # A container answering on loopback does not prove the public path
          # works, and the certificate only exists once Caddy has reloaded. Check
          # the real URL so a broken release cannot report success.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 https://cricketapp.in/health)
          echo "https://cricketapp.in/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::public health check returned $code, expected 200"
            exit 1
          fi