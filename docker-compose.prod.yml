name: cricketapp

services:
  cricketapp:
    image: ghcr.io/sanjithhithub/cricketapp:main
    container_name: cricketapp
    restart: unless-stopped
    # Bound to loopback on purpose: Caddy owns :80/:443 on the host and is the
    # only thing that should reach the app. Publishing 0.0.0.0 here would expose
    # the API unencrypted and let it bypass the TLS cert.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Credentials for S3 come from the instance profile
      # (cricketapp-s3-upload), which is attached to this EC2 instance. boto3
      # reaches IMDS at 169.254.169.254 to fetch short-lived credentials that
      # AWS rotates hourly, so no access key is ever written to .env or baked
      # into this image.
      #
      # Containers do not inherit the instance profile automatically, so the
      # region must be set explicitly or boto3 guesses and S3 calls fail with
      # NoRegionError. It is declared here rather than in .env because it is a
      # property of the deployment target, not a secret.
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      # IMDSv2 is enabled on this instance, so IMDSv1 responses are refused.
      # boto3 already uses IMDSv2 by default; this is here so a future SDK
      # downgrade cannot silently fall back to the unauthenticated protocol.
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://169.254.169.254
      # The bucket this app writes to. Kept in compose so a wrong bucket cannot
      # come from an operator-editable file.
      S3_UPLOAD_BUCKET: cricketapp-uploads-crizz
    depends_on:
      cricketdb:
        condition: service_healthy
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - uploads_data:/app/uploads

  cricketdb:
    image: postgres:16-alpine
    container_name: cricketdb
    restart: unless-stopped
    # Not published to the host: only the app container needs to reach it, over
    # the compose network. Exposing 5432 publicly would leave Postgres open to
    # the internet behind this security group.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moviedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  uploads_data:
