name: cricketapp

services:
  cricketapp:
    image: ghcr.io/sanjithhithub/cricketapp:main
    container_name: cricketapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@cricketdb:5432/moviedb
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - uploads_data:/app/uploads
    depends_on:
      cricketdb:
        condition: service_healthy

  cricketdb:
    image: postgres:16-alpine
    container_name: cricketdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moviedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data: